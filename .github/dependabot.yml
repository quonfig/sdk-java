# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - gradle
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Runtime dependencies of the published artifacts (api/implementation,
      # plus compileOnly integrations where the customer brings their own
      # version). A major bump here raises the floor every customer must run.
      # Raise these deliberately in a release, not via Dependabot.
      - dependency-name: "com.fasterxml.jackson.core:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.slf4j:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.guava:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.logging.log4j:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ch.qos.logback:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.micronaut:*"
        update-types: ["version-update:semver-major"]

name: Failover Chaos

# Runs the failover + canonical-ordering chaos rigs (toxiproxy + the
# scenarios-failover/ and scenarios-ordering/ corpus from
# integration-test-data/chaos) against sdk-java. Jeff wants these running all the
# time, so this fires on every push to main + every PR alongside the existing
# Test workflow (test.yaml). Mirrors sdk-go's failover-chaos.yaml.
#
# The JUnit test (FailoverChaosTest, gated on CHAOS_RUN=1) builds api-delivery and
# spawns its own fixture upstream(s) — one upstream behind the primary+secondary
# proxies for failover, two upstreams at divergent Meta.generations for ordering —
# so this job only has to boot toxiproxy via scripts/run-failover-chaos.sh.
#
# Scenarios gated here: f01-f05 (failover) + o02-o04 (ordering). o01-secondary-
# newer is SKIPPED (CHAOS_SKIP=o01, the run-script default) — it asserts cross-leg
# "max-wins" (hold the higher generation even when the older primary leg is
# healthy), which the backend SDKs do not yet implement (out of the §5f
# reject-older scope, "no source ranking"). That behaviour is owned by
# qfg-7h5d.1.14; drop CHAOS_SKIP once it lands.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  failover-chaos:
    name: Failover + Ordering Chaos
    runs-on: ubuntu-latest
    # Suite is ~2 min; cap at 30 to absorb warmup + docker pull + api-delivery
    # build. Scenarios fail fast inside the JUnit test via their own
    # wall_clock_seconds, so this only kicks in if something hangs.
    timeout-minutes: 30
    # The `secrets` context cannot be referenced in step `if:` conditions, so
    # surface the token's presence as a job-level env var. Dependabot-triggered
    # runs have no access to repo Actions secrets, so HAS_REPO_TOKEN is 'false'
    # for them and the chaos harness steps below are skipped rather than hard
    # failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-java
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: sdk-java

      - name: Checkout integration-test-data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Tracks main: the scenarios-failover/ + scenarios-ordering/ corpus
          # this job drives only exists on main and is not yet in a tag (test.yaml
          # pins v2026.05.20, which predates it). Pin to a tag once the corpus is
          # rev'd into one. Mirrors sdk-go's failover-chaos.yaml pinning rationale.
          ref: main

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it. A PAT
        # or fine-grained token with read access to quonfig/api-delivery must be
        # configured as the repo secret QUONFIG_REPO_TOKEN. Dependabot runs do NOT
        # have access to repo Actions secrets, so for those the token is empty and
        # the chaos harness is skipped rather than hard failing. The two rigs build
        # api-delivery from source (GOWORK=off) to spawn their fixture upstreams.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Set up Java
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: env.HAS_REPO_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b  # v4

      - name: Set up Go (to build api-delivery)
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the failover chaos harness; Test jobs still gate this PR."

      - name: Run failover + ordering chaos rigs
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-java
        # CHAOS_SKIP defaults to o01 inside run-failover-chaos.sh (cross-leg
        # max-wins, qfg-7h5d.1.14). Set here explicitly for visibility.
        env:
          CHAOS_SKIP: o01
        run: ./scripts/run-failover-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: failover-chaos-logs-${{ github.run_id }}
          path: |
            sdk-java/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7

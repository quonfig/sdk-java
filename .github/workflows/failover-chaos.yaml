name: Failover Chaos

# Runs the failover + canonical-ordering chaos rigs (toxiproxy + the
# scenarios-failover/ and scenarios-ordering/ corpus from
# integration-test-data/chaos) against sdk-java. Jeff wants these running all the
# time, so this fires on every push to main + every PR alongside the existing
# Test workflow (test.yaml). Mirrors sdk-go's failover-chaos.yaml.
#
# The JUnit test (FailoverChaosTest, gated on CHAOS_RUN=1) builds api-delivery and
# spawns its own fixture upstream(s) — one upstream behind the primary+secondary
# proxies for failover, two upstreams at divergent Meta.generations for ordering —
# so this job only has to boot toxiproxy via scripts/run-failover-chaos.sh.
#
# Scenarios gated here: f01-f05 (failover) + o01-o05 (ordering). The full ordering
# set runs now that the parallel-failover hedge (qfg-7h5d.1.14) has landed: o01
# (fast primary wins, secondary never contacted / cold standby), o03 (slow newer
# primary heals forward), and o05 (slow older primary loses to fast newer
# secondary). CHAOS_SKIP is empty — nothing is excluded.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly run on main (WS3.2, qfg-41nh.14): post-1.1.0 this suite is
    # otherwise dormant between SDK pushes while api-delivery keeps moving.
    # Cron times are staggered across the six backend SDK repos (06:10-07:25
    # UTC, 15 min apart) to be kind to shared runners and the toxiproxy image
    # pulls. Scheduled runs use repo-level secrets (QUONFIG_REPO_TOKEN is
    # repo-scoped), so the api-delivery checkout works here too. Failure
    # visibility relies on GitHub's default watcher-notification emails —
    # there is no Slack webhook wired into these repos yet.
    - cron: '10 7 * * *'

jobs:
  failover-chaos:
    name: Failover + Ordering Chaos
    runs-on: ubuntu-latest
    # Suite is ~2 min; cap at 30 to absorb warmup + docker pull + api-delivery
    # build. Scenarios fail fast inside the JUnit test via their own
    # wall_clock_seconds, so this only kicks in if something hangs.
    timeout-minutes: 30
    # The `secrets` context cannot be referenced in step `if:` conditions, so
    # surface the token's presence as a job-level env var. Dependabot-triggered
    # runs have no access to repo Actions secrets, so HAS_REPO_TOKEN is 'false'
    # for them and the chaos harness steps below are skipped rather than hard
    # failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          path: sdk-java

      - name: Checkout integration-test-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Kept equal to the unit pin in test.yaml and to chaos.yaml (one ITD tag
          # per repo, qfg-goi1.1.6). Includes the parallel-failover hedge corpus
          # (v2026.06.19.1): reframed o01 (fast primary wins; secondary never
          # contacted), o05 (slow older primary loses to fast newer secondary) and
          # o03 (heal forward). v2026.10.16.2 adds after_ms + the timeline rules
          # (qfg-goi1.7, harness: qfg-goi1.10.36).
          ref: v2026.10.16.2

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it. A PAT
        # or fine-grained token with read access to quonfig/api-delivery must be
        # configured as the repo secret QUONFIG_REPO_TOKEN. Dependabot runs do NOT
        # have access to repo Actions secrets, so for those the token is empty and
        # the chaos harness is skipped rather than hard failing. The two rigs build
        # api-delivery from source (GOWORK=off) to spawn their fixture upstreams.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Record resolved api-delivery SHA
        # api-delivery tracks main on purpose (the nightly/push runs exist to
        # catch api-delivery drift; Decision 8 in
        # project/sdk-quality-check/META-ANALYSIS.md). Print the exact commit
        # so a red run can be tied to the api-delivery change that caused it.
        if: env.HAS_REPO_TOKEN == 'true'
        run: |
          sha="$(git -C api-delivery rev-parse HEAD)"
          echo "api-delivery main resolved to ${sha}"
          echo "api-delivery: \`main\` @ \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: env.HAS_REPO_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b  # v4

      - name: Set up Go (to build api-delivery)
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the failover chaos harness; Test jobs still gate this PR."

      - name: Run failover + ordering chaos rigs
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-java
        # The parallel-failover hedge (qfg-7h5d.1.14) lands o01 (fast primary wins,
        # secondary never contacted) and o03 (heal forward), and o05 (slow older
        # primary loses) auto-includes. Run the full ordering set: CHAOS_SKIP empty.
        env:
          CHAOS_SKIP: ''
        run: ./scripts/run-failover-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: failover-chaos-logs-${{ github.run_id }}
          path: |
            sdk-java/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Post failure to Slack
        # The nightly scheduled run posts to #incoming-webhook (org secret
        # SLACK_CI_WEBHOOK) only when it is not green; a hand-dispatched run
        # always posts. PR, push and workflow_call runs never post.
        if: always() && github.workflow == 'Failover Chaos' && ((github.event_name == 'schedule' && job.status != 'success') || github.event_name == 'workflow_dispatch')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE: failover + ordering chaos
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_CI_WEBHOOK is not available to this run"
            exit 1
          fi
          case "$STATUS" in
            success) icon=":white_check_mark:" ;;
            cancelled) icon=":heavy_minus_sign:" ;;
            *) icon=":rotating_light:" ;;
          esac
          text="${icon} *${GITHUB_REPOSITORY}* ${SUITE} (${GITHUB_EVENT_NAME}): *${STATUS}* <${RUN_URL}|view run>"
          jq -n --arg text "$text" '{text: $text}' |
            curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"

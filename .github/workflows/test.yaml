name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17"]
    steps:
      - name: Checkout sdk-java
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: sdk-java

      - name: Checkout integration-test-data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned to a tag (not main) so a typo in shared YAML can't
          # break every SDK's CI at once. Bump to a newer tag when
          # adopting new test cases. See integration-test-data/RELEASING.md.
          ref: v2026.05.20

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b  # v4

      - name: Spotless check
        working-directory: sdk-java
        run: ./gradlew spotlessCheck

      # Node is needed only to run the integration-test-data generator below.
      - name: Set up Node (integration-test generator)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # The core/src/test/java/com/quonfig/sdk/integration/*Test.java files are
      # produced by the integration-test-data generator, not hand-written
      # (TestSetup.java is the one hand-written helper and the generator never
      # touches it). Generation is a manual step, so a change to the shared
      # YAML (or the generator) that isn't regenerated here would leave these
      # tests stale while CI stayed green against the old copy. Regenerate from
      # the pinned tag, re-run spotlessApply (the generator emits unformatted
      # code), and fail if anything differs from what is committed.
      - name: Check generated integration tests are in sync
        working-directory: sdk-java
        run: |
          (cd ../integration-test-data/generators && npm ci && npm run generate -- --target=java)
          ./gradlew spotlessApply
          git diff --exit-code core/src/test/java/com/quonfig/sdk/integration/ \
            || { echo "::error::Generated integration tests are out of sync with integration-test-data. Run 'npm run generate -- --target=java' in integration-test-data/generators, run ./gradlew spotlessApply, and commit the result."; exit 1; }

      - name: Test
        working-directory: sdk-java
        run: ./gradlew test

name: Chaos

# Runs the cross-SDK single-upstream chaos harness (toxiproxy + scenarios
# from integration-test-data/chaos) against sdk-java. Boots api-delivery in
# fixture mode and drives every scenario in scenarios/*.yaml through it via
# scripts/run-chaos.sh (which runs `./gradlew :core:test --tests ChaosTest`).
# This is the SSE-stall / Layer-2-fallback / reconnect suite — the class
# that caught qfg-sc90 in sdk-go — distinct from failover-chaos.yaml
# (scenarios-failover/ + scenarios-ordering/). Ported per WS3.3 of
# project/plans/secondary-delivery/post-release-hardening.md (qfg-41nh.15).
#
# Two modes:
#   - smoke   : skips 11-null-hypothesis (the 30-minute idle scenario);
#               runs on every push to main + every PR (~18 min wall clock).
#   - full    : every scenario; runs on tags + workflow_dispatch (~48 min).
#
# Wired via workflow_call so release automation can `needs:` it. sdk-java's
# publish.yaml is tag-triggered, and this workflow also fires on `v*` tags
# in full mode, so the full suite runs alongside publish on every tagged
# commit (visible in the Actions UI for the tag). It does not currently
# block publish — mirroring sdk-go, where the gate is "the chaos workflow
# on the tag must be green before the release is announced".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  chaos:
    name: Chaos (${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'full' || inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    # NOTE: the run step computes MODE with `&& 'full'` (a truthy literal),
    # NOT the `&& '' || '11'` idiom the sibling repos' chaos.yaml uses for
    # CHAOS_SKIP — in GitHub expressions `''` is falsy, so `x && '' || y`
    # ALWAYS yields y and a "full" run silently skips scenario 11 (caught
    # here on the first dispatch: the job was named "full" but env showed
    # CHAOS_SKIP=11). CHAOS_SKIP is derived from MODE in shell, where the
    # empty string behaves.
    #
    # Smoke ~18 min; full ~48 min. Cap at 75 min to allow for warmup +
    # docker pull + gradle/api-delivery builds. Each scenario fails fast
    # inside the JUnit test via its own wall_clock_seconds, so this only
    # kicks in if something hangs.
    timeout-minutes: 75
    # The `secrets` context cannot be referenced in step `if:` conditions,
    # so surface the token's presence as a job-level env var. Dependabot-
    # triggered runs have no access to repo Actions secrets, so
    # HAS_REPO_TOKEN is 'false' for them and the chaos harness steps below
    # are skipped rather than hard failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-java
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: sdk-java

      - name: Checkout integration-test-data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned per the 2026-05-13 reliability audit so the chaos gate
          # moves only when the scenarios are deliberately rev'd — the
          # same pin sdk-go/node/ruby/python use for this suite (NOT the
          # failover-chaos pin). Bump alongside the matching SDK change.
          ref: v2026.05.13

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it.
        # A PAT or fine-grained token with read access to
        # quonfig/api-delivery must be configured as the repo secret
        # QUONFIG_REPO_TOKEN (already provisioned for failover-chaos.yaml).
        # Dependabot runs do NOT have access to repo Actions secrets, so
        # for those the token is empty and the chaos harness is skipped
        # rather than hard failing.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Set up Java
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: env.HAS_REPO_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b  # v4

      - name: Set up Go (to build api-delivery)
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the chaos harness; Test jobs still gate this PR."

      - name: Run chaos harness
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-java
        env:
          # smoke on push/PR; full on tag pushes and workflow_call/dispatch
          # with mode=full. See the job-level NOTE for why this avoids the
          # `&& '' || '11'` expression idiom.
          MODE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'full' || inputs.mode || 'smoke' }}
        run: |
          # Smoke skips 11-null-hypothesis (30 min idle). Full suite runs
          # everything. The wrapper honors CHAOS_SKIP.
          if [ "$MODE" = "full" ]; then
            CHAOS_SKIP=""
          else
            CHAOS_SKIP="11"
          fi
          export CHAOS_SKIP
          echo "mode=$MODE CHAOS_SKIP=${CHAOS_SKIP:-<none>}"
          ./scripts/run-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chaos-logs-${{ github.run_id }}
          path: |
            sdk-java/chaos-*.log
            sdk-java/core/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

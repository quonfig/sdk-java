name: Chaos

# Runs the cross-SDK single-upstream chaos harness (toxiproxy + scenarios
# from integration-test-data/chaos) against sdk-java. Boots api-delivery in
# fixture mode and drives every scenario in scenarios/*.yaml through it via
# scripts/run-chaos.sh (which runs `./gradlew :core:test --tests ChaosTest`).
# This is the SSE-stall / Layer-2-fallback / reconnect suite — the class
# that caught qfg-sc90 in sdk-go — distinct from failover-chaos.yaml
# (scenarios-failover/ + scenarios-ordering/). Ported per WS3.3 of
# project/plans/secondary-delivery/post-release-hardening.md (qfg-41nh.15).
#
# Two modes:
#   - smoke   : skips 11-null-hypothesis (the 30-minute idle scenario);
#               runs on every push to main (~16 min wall clock). Not run
#               on PRs: too slow to gate every PR, so failover-chaos.yaml
#               (~2 min) is the PR-time chaos gate.
#   - full    : every scenario; runs weekly (Mon UTC), on tags + workflow_dispatch (~48 min).
#
# Wired via workflow_call so release automation can `needs:` it. sdk-java's
# publish.yaml is tag-triggered, and this workflow also fires on `v*` tags
# in full mode, so the full suite runs alongside publish on every tagged
# commit (visible in the Actions UI for the tag). It does not currently
# block publish — mirroring sdk-go, where the gate is "the chaos workflow
# on the tag must be green before the release is announced".

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Weekly full suite (incl. 11-null-hypothesis) so the 30-minute
    # scenario runs even in weeks without a release.
    - cron: "30 9 * * 1"
  workflow_call:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  chaos:
    name: Chaos (${{ (github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 'full' || inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    # NOTE: the run step computes MODE with `&& 'full'` (a truthy literal),
    # NOT the `&& '' || '11'` idiom the sibling repos' chaos.yaml uses for
    # CHAOS_SKIP — in GitHub expressions `''` is falsy, so `x && '' || y`
    # ALWAYS yields y and a "full" run silently skips scenario 11 (caught
    # here on the first dispatch: the job was named "full" but env showed
    # CHAOS_SKIP=11). CHAOS_SKIP is derived from MODE in shell, where the
    # empty string behaves.
    #
    # Smoke ~16 min; full ~48 min. Cap at 75 min to allow for warmup +
    # docker pull + gradle/api-delivery builds. Each scenario fails fast
    # inside the JUnit test via its own wall_clock_seconds, so this only
    # kicks in if something hangs.
    timeout-minutes: 75
    # The `secrets` context cannot be referenced in step `if:` conditions,
    # so surface the token's presence as a job-level env var. Dependabot-
    # triggered runs have no access to repo Actions secrets, so
    # HAS_REPO_TOKEN is 'false' for them and the chaos harness steps below
    # are skipped rather than hard failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          path: sdk-java

      - name: Checkout integration-test-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned to a tag so the chaos gate moves only when the scenarios
          # are deliberately rev'd. Kept equal to the unit pin in test.yaml
          # and to failover-chaos.yaml (one ITD tag per repo, qfg-goi1.1.6).
          # v2026.10.16.2 adds after_ms + the timeline rules (qfg-goi1.7);
          # the harness implements them (qfg-goi1.10.36). v2026.10.21.1 adds
          # 00-boot-both-down-then-restore (init-failure vocabulary) and moves
          # 02's state row to 'disconnected' (qfg-6vno.3). v2026.10.22.2 moves
          # scenario 10 exp[0] to callback_errors_total (qfg-6vno.28).
          # scripts/check-itd-refs.sh
          # (run by test.yaml) fails CI when the three pins differ (qfg-6vno.7).
          ref: v2026.10.26

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it.
        # A PAT or fine-grained token with read access to
        # quonfig/api-delivery must be configured as the repo secret
        # QUONFIG_REPO_TOKEN (already provisioned for failover-chaos.yaml).
        # Dependabot runs do NOT have access to repo Actions secrets, so
        # for those the token is empty and the chaos harness is skipped
        # rather than hard failing.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Record resolved api-delivery SHA
        # api-delivery tracks main on purpose (the nightly/push runs exist to
        # catch api-delivery drift; Decision 8 in
        # project/sdk-quality-check/META-ANALYSIS.md). Print the exact commit
        # so a red run can be tied to the api-delivery change that caused it.
        if: env.HAS_REPO_TOKEN == 'true'
        run: |
          sha="$(git -C api-delivery rev-parse HEAD)"
          echo "api-delivery main resolved to ${sha}"
          echo "api-delivery: \`main\` @ \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: env.HAS_REPO_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b  # v4

      - name: Set up Go (to build api-delivery)
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the chaos harness; Test jobs still gate this PR."

      - name: Run chaos harness
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-java
        env:
          # smoke on push to main; full on tag pushes and workflow_call/dispatch
          # with mode=full. See the job-level NOTE for why this avoids the
          # `&& '' || '11'` expression idiom.
          MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 'full' || inputs.mode || 'smoke' }}
        run: |
          # Smoke skips 11-null-hypothesis (30 min idle). Full suite runs
          # everything. The wrapper honors CHAOS_SKIP.
          if [ "$MODE" = "full" ]; then
            CHAOS_SKIP=""
          else
            CHAOS_SKIP="11"
          fi
          export CHAOS_SKIP
          echo "mode=$MODE CHAOS_SKIP=${CHAOS_SKIP:-<none>}"
          ./scripts/run-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: chaos-logs-${{ github.run_id }}
          path: |
            sdk-java/chaos-*.log
            sdk-java/core/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Post result to Slack
        # Scheduled (weekly full) and hand-dispatched runs report every result
        # to #incoming-webhook via the org secret SLACK_CI_WEBHOOK. PR and push
        # runs never post, and neither does a release workflow calling this one
        # via workflow_call (github.workflow is then the caller's name).
        if: always() && github.workflow == 'Chaos' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE: chaos (${{ github.event_name == 'schedule' && 'full' || inputs.mode || 'smoke' }})
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_CI_WEBHOOK is not available to this run"
            exit 1
          fi
          case "$STATUS" in
            success) icon=":white_check_mark:" ;;
            cancelled) icon=":heavy_minus_sign:" ;;
            *) icon=":rotating_light:" ;;
          esac
          text="${icon} *${GITHUB_REPOSITORY}* ${SUITE} (${GITHUB_EVENT_NAME}): *${STATUS}* <${RUN_URL}|view run>"
          jq -n --arg text "$text" '{text: $text}' |
            curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
